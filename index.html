<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Mesh — сеточная маска лица</title>
<style>
  :root{
    --bg: #05080a;
    --panel: #0c1416;
    --line: #163024;
    --accent: #39ff9d;   /* неоново-зелёный — цвет сетки */
    --accent-2: #24e0ff; /* циан — акцентные контуры (глаза/губы/овал) */
    --text: #d9fbe8;
    --muted: #5f8f7c;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', ui-monospace, Consolas, monospace;
  }
  body{
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding: 24px 16px 40px;
  }
  header{
    width:100%; max-width: 720px;
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom: 14px;
  }
  h1{
    font-size: 15px; letter-spacing: 3px; text-transform: uppercase;
    margin:0; color: var(--accent);
    font-weight: 600;
  }
  h1 span{ color: var(--muted); }
  #status-badge{
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    padding: 4px 10px; border-radius: 3px;
    border: 1px solid var(--line);
    color: var(--muted);
    white-space: nowrap;
  }
  #status-badge.active{ color: var(--accent); border-color: var(--accent); }
  #status-badge.error{ color: #ff5c5c; border-color: #ff5c5c; }

  .stage{
    position: relative;
    width: 100%; max-width: 720px;
    aspect-ratio: 4 / 3;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
  }
  .mirror{
    position:absolute; inset:0;
    transform: scaleX(-1); /* зеркалим и видео, и канвас вместе — координаты не расходятся */
  }
  video, canvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
    object-fit: cover;
  }
  video{ opacity: 0.85; }

  /* декоративная сетка-разметка вокруг сцены, в духе "скан-интерфейса" */
  .stage::before{
    content:"";
    position:absolute; inset:0;
    pointer-events:none;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.25;
    z-index: 2;
  }
  .corner{
    position:absolute; width:18px; height:18px;
    border: 2px solid var(--accent);
    opacity:0.8; z-index:3; pointer-events:none;
  }
  .corner.tl{ top:8px; left:8px; border-right:none; border-bottom:none; }
  .corner.tr{ top:8px; right:8px; border-left:none; border-bottom:none; }
  .corner.bl{ bottom:8px; left:8px; border-right:none; border-top:none; }
  .corner.br{ bottom:8px; right:8px; border-left:none; border-top:none; }

  .overlay-msg{
    position:absolute; inset:0; z-index:4;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding: 20px;
    background: rgba(5,8,10,0.88);
  }
  .overlay-msg.hidden{ display:none; }
  .overlay-msg p{ margin:0; font-size:13px; color: var(--muted); max-width: 420px; line-height:1.6; }

  button{
    font-family: inherit;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 10px 22px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  button:hover{ background: var(--accent); color: #04140c; }
  button:disabled{ opacity:0.4; cursor:default; background:none; color:var(--accent); }

  footer{
    width:100%; max-width: 720px;
    margin-top: 14px;
    display:flex; justify-content:space-between;
    font-size: 11px; color: var(--muted); letter-spacing: 0.5px;
  }
  #face-count{ color: var(--accent-2); }

  @media (prefers-reduced-motion: reduce){
    button{ transition:none; }
  }
</style>
</head>
<body>

  <header>
    <h1>Face Mesh <span>// сеточная маска</span></h1>
    <div id="status-badge">инициализация</div>
  </header>

  <div class="stage" id="stage">
    <div class="mirror">
      <video id="video" playsinline autoplay muted></video>
      <canvas id="canvas"></canvas>
    </div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="overlay-msg" id="start-overlay">
      <p>Нужен доступ к камере, чтобы построить полигональную сетку по точкам лица (468 точек, MediaPipe Face Mesh). Обработка идёт локально в браузере — видео никуда не отправляется.</p>
      <button id="start-btn">Разрешить камеру</button>
    </div>
  </div>

  <footer>
    <span id="fps-counter">fps: —</span>
    <span id="face-count">лиц не обнаружено</span>
  </footer>

  <!-- MediaPipe Face Mesh -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous"></script>

  <script>
    const videoEl = document.getElementById('video');
    const canvasEl = document.getElementById('canvas');
    const ctx = canvasEl.getContext('2d');
    const statusBadge = document.getElementById('status-badge');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const faceCountEl = document.getElementById('face-count');
    const fpsEl = document.getElementById('fps-counter');

    let camera = null;
    let lastFrameTime = performance.now();

    function setStatus(text, mode){
      statusBadge.textContent = text;
      statusBadge.classList.remove('active', 'error');
      if(mode) statusBadge.classList.add(mode);
    }

    // Настройка FaceMesh: загружаем модель и её wasm-файлы с CDN
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,          // сколько лиц ищем одновременно
      refineLandmarks: true,   // уточнённые точки глаз/губ (нужно для радужки)
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    faceMesh.onResults(onResults);

    function onResults(results){
      // синхронизируем разрешение канваса с реальным видеопотоком
      if(canvasEl.width !== results.image.width || canvasEl.height !== results.image.height){
        canvasEl.width = results.image.width;
        canvasEl.height = results.image.height;
      }

      ctx.save();
      ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);

      const landmarksList = results.multiFaceLandmarks || [];

      if(landmarksList.length > 0){
        faceCountEl.textContent = `обнаружено лиц: ${landmarksList.length}`;
        setStatus('лицо обнаружено', 'active');

        for(const landmarks of landmarksList){
          // 1) сама полигональная сетка (тесселяция) — тонкие треугольники по всему лицу
          drawConnectors(ctx, landmarks, FACEMESH_TESSELATION, {
            color: 'rgba(57, 255, 157, 0.55)',
            lineWidth: 1
          });

          // 2) акцентные контуры поверх сетки — овал лица, глаза, брови, губы
          drawConnectors(ctx, landmarks, FACEMESH_FACE_OVAL,   { color: '#24e0ff', lineWidth: 1.5 });
          drawConnectors(ctx, landmarks, FACEMESH_LEFT_EYE,    { color: '#24e0ff', lineWidth: 1.5 });
          drawConnectors(ctx, landmarks, FACEMESH_RIGHT_EYE,   { color: '#24e0ff', lineWidth: 1.5 });
          drawConnectors(ctx, landmarks, FACEMESH_LEFT_EYEBROW,{ color: '#24e0ff', lineWidth: 1.5 });
          drawConnectors(ctx, landmarks, FACEMESH_RIGHT_EYEBROW,{ color: '#24e0ff', lineWidth: 1.5 });
          drawConnectors(ctx, landmarks, FACEMESH_LIPS,        { color: '#24e0ff', lineWidth: 1.5 });

          // 3) радужка глаз (доступна благодаря refineLandmarks: true)
          if(FACEMESH_LEFT_IRIS && FACEMESH_RIGHT_IRIS){
            drawConnectors(ctx, landmarks, FACEMESH_LEFT_IRIS,  { color: '#ffffff', lineWidth: 1 });
            drawConnectors(ctx, landmarks, FACEMESH_RIGHT_IRIS, { color: '#ffffff', lineWidth: 1 });
          }

          // 4) сами узлы сетки — мелкие точки поверх линий
          drawLandmarks(ctx, landmarks, {
            color: '#39ff9d',
            fillColor: '#39ff9d',
            radius: 0.8
          });
        }
      } else {
        faceCountEl.textContent = 'лицо не обнаружено';
        setStatus('поиск лица…', null);
      }

      ctx.restore();

      // простой счётчик fps
      const now = performance.now();
      const fps = 1000 / (now - lastFrameTime);
      lastFrameTime = now;
      fpsEl.textContent = `fps: ${fps.toFixed(0)}`;
    }

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      startBtn.textContent = 'Запрашиваем доступ…';
      setStatus('запрос доступа к камере', null);

      try{
        camera = new Camera(videoEl, {
          onFrame: async () => {
            await faceMesh.send({ image: videoEl });
          },
          width: 1280,
          height: 960
        });
        await camera.start();

        startOverlay.classList.add('hidden');
        setStatus('камера активна', 'active');
      } catch(err){
        console.error(err);
        setStatus('доступ к камере отклонён', 'error');
        startBtn.disabled = false;
        startBtn.textContent = 'Повторить попытку';

        const p = startOverlay.querySelector('p');
        p.textContent = 'Не удалось получить доступ к камере. Проверьте, что сайт открыт по HTTPS (или localhost) и что разрешение на камеру не заблокировано в настройках браузера. Затем нажмите кнопку ещё раз.';
      }
    });
  </script>

</body>
</html>
