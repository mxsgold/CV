<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Face Mesh - Strict Resize</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #fff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    
    /* Контейнер строго держит слои вместе */
    .container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Видео и Canvas накладываются жестко друг на друга */
    video, canvas {
      position: absolute;
      /* Отключаем object-fit, масштабирование будет через JS */
      width: 100%;
      height: 100%;
      object-fit: contain; 
    }
    
    video { z-index: 1; }
    
    /* Canvas прозрачный и не мешает кликам */
    canvas { 
      z-index: 2; 
      background: transparent;
      pointer-events: none;
    }
    
    #status {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0, 0, 0, 0.9);
      color: #00FF66;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      border: 1px solid #00FF66;
      text-align: center;
      pointer-events: none;
    }
    
    #startBtn {
      position: absolute;
      z-index: 20;
      padding: 16px 32px;
      background: #00FF66;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      box-shadow: 0 0 15px rgba(0,255,102,0.5);
      cursor: pointer;
    }
  </style>

  <!-- Подключаем библиотеки MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

<div class="container">
  <div id="status">Нажмите кнопку снизу для запуска</div>
  <button id="startBtn">Включить камеру</button>
  <video id="webcam" playsinline autoplay muted></video>
  <!-- Добавлен явный размер по умолчанию -->
  <canvas id="output_canvas" width="1280" height="720"></canvas>
</div>

<script>
  const statusDiv = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const videoElement = document.getElementById('webcam');
  const canvasElement = document.getElementById('output_canvas');
  const canvasCtx = canvasElement.getContext('2d');

  // Глобальный перехват ошибок
  window.onerror = function(msg) {
    statusDiv.style.color = '#FF3333';
    statusDiv.style.borderColor = '#FF3333';
    statusDiv.innerText = "Ошибка: " + msg;
  };

  startBtn.addEventListener('click', async () => {
    startBtn.style.display = 'none';
    statusDiv.innerText = "Запрос камеры...";

    try {
      // Запрашиваем поток
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user' },
        audio: false
      });
      videoElement.srcObject = stream;
      await videoElement.play();

      statusDiv.innerText = "Загрузка алгоритмов MediaPipe...";

      const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });

      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      faceMesh.onResults((results) => {
        // Жесткая синхронизация размеров Canvas и Видео
        if (videoElement.videoWidth && videoElement.videoHeight) {
          if (canvasElement.width !== videoElement.videoWidth || canvasElement.height !== videoElement.videoHeight) {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
          }
        }

        canvasCtx.save();
        // Очищаем предыдущий кадр
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
          statusDiv.innerText = "Лицо найдено ✓ (Рисую сетку)";
          
          for (const landmarks of results.multiFaceLandmarks) {
            // Отрисовка сетки
            drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELLATION, {
              color: '#00FF66',
              lineWidth: 1.5
            });
          }
        } else {
          statusDiv.innerText = "Поиск лица в кадре...";
        }
        canvasCtx.restore();
      });

      // Цикл отправки кадров
      async function renderFrame() {
        if (!videoElement.paused && !videoElement.ended) {
          await faceMesh.send({image: videoElement});
        }
        requestAnimationFrame(renderFrame);
      }
      
      // Запускаем цикл
      renderFrame();

    } catch (err) {
      statusDiv.style.color = '#FF3333';
      statusDiv.style.borderColor = '#FF3333';
      statusDiv.innerText = "Доступ к камере отклонен!";
    }
  });
</script>
</body>
</html>
