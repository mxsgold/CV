<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Face Mesh Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* Видео снизу */
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    /* Сетка поверх видео */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 2;
    }
    /* Индикатор статуса */
    #status {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      background: rgba(0, 0, 0, 0.7);
      color: #00FF66;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      border: 1px solid #00FF66;
    }
  </style>

  <!-- Закрепленные стабильные версии MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.4/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.4/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

<div class="container">
  <div id="status">Загрузка модели...</div>
  <video id="webcam" playsinline autoplay muted></video>
  <canvas id="output_canvas"></canvas>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const canvasElement = document.getElementById('output_canvas');
  const canvasCtx = canvasElement.getContext('2d');
  const statusDiv = document.getElementById('status');

  const faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/${file}`
  });

  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  let modelReady = false;

  faceMesh.onResults((results) => {
    if (!modelReady) {
      modelReady = true;
      statusDiv.innerText = "Поиск лица...";
    }

    // Подстройка разрешения Canvas под видеокадр
    if (videoElement.videoWidth && videoElement.videoHeight) {
      if (canvasElement.width !== videoElement.videoWidth) {
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
      }
    }

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

    if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
      statusDiv.innerText = "Лицо найдено ✓";
      for (const landmarks of results.multiFaceLandmarks) {
        // Отрисовка сетки
        drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELLATION, {
          color: '#00FF66',
          lineWidth: 1.5
        });
      }
    } else if (modelReady) {
      statusDiv.innerText = "Поиск лица...";
    }

    canvasCtx.restore();
  });

  const camera = new Camera(videoElement, {
    onFrame: async () => {
      await faceMesh.send({image: videoElement});
    },
    facingMode: 'user',
    width: 1280,
    height: 720
  });

  camera.start();
</script>
</body>
</html>
