<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Face Mesh - Anti-Freeze</title>
  <style>
    body { margin: 0; background: #000; overflow: hidden; color: #fff; font-family: sans-serif; }
    video, canvas { position: absolute; width: 100vw; height: 100vh; object-fit: cover; }
    video { z-index: 1; }
    canvas { z-index: 2; pointer-events: none; }
    
    #status {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
      background: rgba(0,0,0,0.85); color: #0FF; padding: 10px 20px; border-radius: 12px; 
      text-align: center; width: 90%; font-size: 16px; border: 1px solid #0FF;
    }
    #btn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20;
      padding: 15px 40px; background: #0FF; color: #000; font-weight: bold; border: none; 
      border-radius: 30px; font-size: 20px; cursor: pointer; box-shadow: 0 0 20px rgba(0,255,255,0.4);
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="status">Ожидание запуска...</div>
  <button id="btn">Запустить</button>
  
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const btn = document.getElementById('btn');

    let framesCount = 0;

    btn.onclick = async () => {
      btn.style.display = 'none';
      status.innerText = "Подключение к камере...";
      status.style.color = '#FFF';
      status.style.borderColor = '#FFF';

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        video.srcObject = stream;
        
        // ЖДЕМ, пока видео реально прогрузится, чтобы не отправить в нейросеть пустой кадр
        video.onloadeddata = async () => {
          status.innerText = "Камера включена. Грузим ИИ...";
          video.play();
          
          const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
          });
          
          faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: false, // Отключено для ускорения на смартфонах
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
          });

          faceMesh.onResults((results) => {
            framesCount++; // Увеличиваем счетчик при каждом успешном анализе
            
            // Выравниваем холст
            if (canvas.width !== video.videoWidth) {
              canvas.width = video.videoWidth;
              canvas.height = video.videoHeight;
            }
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
              status.innerText = `[Кадр: ${framesCount}] Лицо найдено!`;
              status.style.color = '#00FF00';
              status.style.borderColor = '#00FF00';
              
              ctx.fillStyle = '#00FF00';
              const landmarks = results.multiFaceLandmarks[0];
              
              // Рисуем точки (пропускаем каждую вторую точку, чтобы не вешать процессор)
              for (let i = 0; i < landmarks.length; i+=2) { 
                const pt = landmarks[i];
                ctx.beginPath();
                ctx.arc(pt.x * canvas.width, pt.y * canvas.height, 2, 0, 2 * Math.PI);
                ctx.fill();
              }
            } else {
              status.innerText = `[Кадр: ${framesCount}] Ищу лицо...`;
              status.style.color = '#FFCC00';
              status.style.borderColor = '#FFCC00';
            }
          });

          // Зацикливаем отправку кадров
          async function processVideo() {
            if (!video.paused && !video.ended) {
              await faceMesh.send({ image: video });
            }
            // Делаем передышку в 30 миллисекунд перед следующим кадром (спасает от зависаний)
            setTimeout(() => {
              requestAnimationFrame(processVideo);
            }, 30);
          }
          
          processVideo();
        };
      } catch (e) {
        status.innerText = "Ошибка: " + e.message;
        status.style.color = 'red';
        status.style.borderColor = 'red';
      }
    };
  </script>
</body>
</html>
