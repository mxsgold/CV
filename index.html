<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Face & Hands Pro</title>
  <style>
    body { margin: 0; background: #000; overflow: hidden; color: #fff; font-family: sans-serif; }
    video, canvas { position: absolute; width: 100vw; height: 100vh; object-fit: cover; }
    video { z-index: 1; }
    canvas { z-index: 2; pointer-events: none; }
    
    #status {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 10;
      background: rgba(0,0,0,0.8); color: #0FF; padding: 10px 15px; border-radius: 12px; 
      font-size: 14px; border: 1px solid #0FF; white-space: nowrap; text-align: center;
    }
    
    #fingerCounter {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 15;
      background: rgba(0,0,0,0.9); color: #FF3333; padding: 15px 30px; border-radius: 20px; 
      font-size: 24px; font-weight: bold; border: 2px solid #FF3333; text-transform: uppercase;
      box-shadow: 0 0 15px rgba(255,51,51,0.5); text-align: center; white-space: nowrap;
    }

    #btn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20;
      padding: 15px 40px; background: #0FF; color: #000; font-weight: bold; border: none; 
      border-radius: 30px; font-size: 20px; cursor: pointer; box-shadow: 0 0 20px rgba(0,255,255,0.4);
    }
  </style>

  <!-- Библиотеки -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="status">Ожидание запуска...</div>
  <div id="fingerCounter" style="display: none;">ЖДИТЕ...</div>
  <button id="btn">Запустить сканер</button>
  
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const fingerCounter = document.getElementById('fingerCounter');
    const btn = document.getElementById('btn');

    let framesCount = 0;
    let latestFace = null;
    let latestHands = null;

    btn.onclick = async () => {
      btn.style.display = 'none';
      fingerCounter.style.display = 'block';
      status.innerText = "Включение камеры...";

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        video.srcObject = stream;
        
        video.onloadeddata = async () => {
          await video.play().catch(e => console.log(e));
          
          try {
            // Инициализация моделей
            status.innerText = "Подготовка ИИ...";
            
            const faceMesh = new FaceMesh({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
            faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: false, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
            faceMesh.onResults((res) => { latestFace = res; });

            const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
            hands.setOptions({ maxNumHands: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
            hands.onResults((res) => { latestHands = res; });

            // ПРОГРЕВ (Именно тут скачиваются файлы, делаем по очереди)
            status.innerText = "Прогрев Лица (1/2) - ждите...";
            await faceMesh.send({ image: video });
            
            status.innerText = "Прогрев Рук (2/2) - ждите...";
            await hands.send({ image: video });
            
          } catch (initErr) {
            status.innerText = "Ошибка загрузки ИИ: " + initErr.message;
            status.style.color = 'red';
            return; // Останавливаем, если телефон не потянул
          }

          status.innerText = "Запуск успешно завершен!";
          
          // ГЛАВНЫЙ ЦИКЛ
          async function processVideo() {
            try {
              if (!video.paused && !video.ended) {
                framesCount++;
                
                // Запускаем анализ
                await faceMesh.send({ image: video });
                await hands.send({ image: video });
                
                if (canvas.width !== video.videoWidth) {
                  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                }
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // === РИСУЕМ ЛИЦО ===
                if (latestFace && latestFace.multiFaceLandmarks && latestFace.multiFaceLandmarks.length > 0) {
                  status.innerText = `[Кадр: ${framesCount}] Сканирование ✓`;
                  status.style.color = '#00FF00'; status.style.borderColor = '#00FF00';
                  
                  const faceLms = latestFace.multiFaceLandmarks[0];
                  ctx.strokeStyle = '#00FF66';
                  ctx.lineWidth = 1;
                  
                  // Защита: если полигоны доступны - рисуем сетку, иначе рисуем точки
                  if (typeof FACEMESH_TESSELLATION !== 'undefined') {
                    ctx.beginPath();
                    for (const connection of FACEMESH_TESSELLATION) {
                      const start = faceLms[connection[0]];
                      const end = faceLms[connection[1]];
                      ctx.moveTo(start.x * canvas.width, start.y * canvas.height);
                      ctx.lineTo(end.x * canvas.width, end.y * canvas.height);
                    }
                    ctx.stroke();
                  } else {
                    ctx.fillStyle = '#00FF66';
                    for (let i = 0; i < faceLms.length; i+=2) {
                      ctx.beginPath(); ctx.arc(faceLms[i].x * canvas.width, faceLms[i].y * canvas.height, 2, 0, 2*Math.PI); ctx.fill();
                    }
                  }
                } else {
                  status.innerText = `[Кадр: ${framesCount}] Ищу лицо...`;
                  status.style.color = '#FFCC00'; status.style.borderColor = '#FFCC00';
                }

                // === СЧИТАЕМ ПАЛЬЦЫ ===
                let openFingers = 0;
                let handDetected = false;
                
                if (latestHands && latestHands.multiHandLandmarks && latestHands.multiHandLandmarks.length > 0) {
                  handDetected = true;
                  const handLms = latestHands.multiHandLandmarks[0];
                  
                  ctx.fillStyle = '#FF00FF'; // Розовые точки на суставы
                  for (let i = 0; i < handLms.length; i++) {
                    ctx.beginPath(); ctx.arc(handLms[i].x * canvas.width, handLms[i].y * canvas.height, 4, 0, 2*Math.PI); ctx.fill();
                  }

                  const tips = [8, 12, 16, 20];
                  const pips = [6, 10, 14, 18];
                  for (let i = 0; i < 4; i++) {
                    if (handLms[tips[i]].y < handLms[pips[i]].y) openFingers++;
                  }
                  
                  const thumbToWrist = Math.hypot(handLms[4].x - handLms[0].x, handLms[4].y - handLms[0].y);
                  const jointToWrist = Math.hypot(handLms[3].x - handLms[0].x, handLms[3].y - handLms[0].y);
                  if (thumbToWrist > jointToWrist) openFingers++;
                }

                // ЛОГИКА ТВОЕЙ ФРАЗЫ
                if (handDetected && openFingers > 0) {
                  fingerCounter.innerText = `Пальцев: ${openFingers}`;
                  fingerCounter.style.color = '#00FF66';
                  fingerCounter.style.borderColor = '#00FF66';
                  fingerCounter.style.boxShadow = '0 0 15px rgba(0,255,102,0.5)';
                } else {
                  // Если рука в кулаке (openFingers == 0) или руки вообще нет в кадре
                  fingerCounter.innerText = 'покажи руку бля';
                  fingerCounter.style.color = '#FF3333';
                  fingerCounter.style.borderColor = '#FF3333';
                  fingerCounter.style.boxShadow = '0 0 15px rgba(255,51,51,0.5)';
                }
              }
            } catch (loopErr) {
              status.innerText = "Ошибка кадра: " + loopErr.message;
            }
            
            // Задержка 40мс, чтобы процессор не сгорел
            setTimeout(() => { requestAnimationFrame(processVideo); }, 40);
          }
          
          processVideo();
        };
      } catch (camErr) {
        status.innerText = "Ошибка камеры: " + camErr.message;
      }
    };
  </script>
</body>
</html>
