<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BY VUSAL</title>
<style>
  :root{
    --bg: #05080a;
    --panel: #0c1416;
    --line: #163024;
    --accent: #39ff9d;   /* неоново-зелёный — сетка лица */
    --accent-2: #24e0ff; /* циан — контуры лица (глаза/губы/овал) */
    --accent-3: #ff3b3b; /* красный — костная модель руки */
    --text: #d9fbe8;
    --muted: #5f8f7c;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', ui-monospace, Consolas, monospace;
  }
  body{
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding: 24px 16px 40px;
  }
  header{
    width:100%; max-width: 720px;
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom: 14px;
  }
  h1{
    font-size: 15px; letter-spacing: 3px; text-transform: uppercase;
    margin:0; color: var(--accent);
    font-weight: 600;
  }
  h1 span{ color: var(--muted); }
  #status-badge{
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    padding: 4px 10px; border-radius: 3px;
    border: 1px solid var(--line);
    color: var(--muted);
    white-space: nowrap;
  }
  #status-badge.active{ color: var(--accent); border-color: var(--accent); }
  #status-badge.error{ color: #ff5c5c; border-color: #ff5c5c; }

  .stage{
    position: relative;
    width: 100%; max-width: 720px;
    aspect-ratio: 4 / 3;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
  }
  .mirror{
    position:absolute; inset:0;
    transform: scaleX(-1); /* зеркалим видео и канвас вместе, координаты не расходятся */
  }
  video, canvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
    object-fit: cover;
  }
  video{ opacity: 0.85; }

  .stage::before{
    content:"";
    position:absolute; inset:0;
    pointer-events:none;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.25;
    z-index: 2;
  }
  .corner{
    position:absolute; width:18px; height:18px;
    border: 2px solid var(--accent);
    opacity:0.8; z-index:3; pointer-events:none;
  }
  .corner.tl{ top:8px; left:8px; border-right:none; border-bottom:none; }
  .corner.tr{ top:8px; right:8px; border-left:none; border-bottom:none; }
  .corner.bl{ bottom:8px; left:8px; border-right:none; border-top:none; }
  .corner.br{ bottom:8px; right:8px; border-left:none; border-top:none; }

  .overlay-msg{
    position:absolute; inset:0; z-index:4;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding: 20px;
    background: rgba(5,8,10,0.88);
  }
  .overlay-msg.hidden{ display:none; }
  .overlay-msg p{ margin:0; font-size:13px; color: var(--muted); max-width: 440px; line-height:1.6; }

  button{
    font-family: inherit;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 10px 22px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  button:hover{ background: var(--accent); color: #04140c; }
  button:disabled{ opacity:0.4; cursor:default; background:none; color:var(--accent); }

  .panels{
    width:100%; max-width: 720px;
    display:flex; gap: 10px; margin-top: 14px;
  }
  .panel{
    flex:1;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 12px 14px;
    background: var(--panel);
  }
  .panel .label{
    font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 6px;
  }
  .panel .value{
    font-size: 28px; font-weight: 700; color: var(--accent-3);
    line-height: 1;
  }
  .panel .value small{
    font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px;
  }

  footer{
    width:100%; max-width: 720px;
    margin-top: 10px;
    display:flex; justify-content:space-between;
    font-size: 11px; color: var(--muted); letter-spacing: 0.5px;
  }

  @media (prefers-reduced-motion: reduce){
    button{ transition:none; }
  }
</style>
</head>
<body>

  <header>
    <h1>BY VUSAL</h1>
    <div id="status-badge">инициализация</div>
  </header>

  <div class="stage" id="stage">
    <div class="mirror">
      <video id="video" playsinline autoplay muted></video>
      <canvas id="canvas"></canvas>
    </div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="overlay-msg" id="start-overlay">
      <p>Нужен доступ к камере: строим сетку по 468 точкам лица и по 21 точке (суставам) каждой руки — MediaPipe Face Mesh + Hands. Всё считается локально в браузере, видео никуда не отправляется.</p>
      <button id="start-btn">Разрешить камеру</button>
    </div>
  </div>

  <div class="panels">
    <div class="panel">
      <div class="label">Лиц обнаружено</div>
      <div class="value" id="face-count">0</div>
    </div>
    <div class="panel">
      <div class="label">Пальцев поднято</div>
      <div class="value" id="finger-count">—<small id="finger-breakdown"></small></div>
    </div>
  </div>

  <footer>
    <span id="fps-counter">fps: —</span>
    <span id="hand-status">рук не обнаружено</span>
  </footer>

  <!-- MediaPipe Face Mesh + Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous"></script>

  <script>
    const videoEl = document.getElementById('video');
    const canvasEl = document.getElementById('canvas');
    const ctx = canvasEl.getContext('2d');
    const statusBadge = document.getElementById('status-badge');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const faceCountEl = document.getElementById('face-count');
    const fingerCountEl = document.getElementById('finger-count');
    const fingerBreakdownEl = document.getElementById('finger-breakdown');
    const handStatusEl = document.getElementById('hand-status');
    const fpsEl = document.getElementById('fps-counter');

    let lastFrameTime = performance.now();

    // здесь храним самые свежие результаты каждой модели —
    // рисуем их вместе в одной функции render(), чтобы модели
    // не затирали холст друг у друга
    let latestFaceLandmarks = [];
    let latestHandLandmarks = [];

    function setStatus(text, mode){
      statusBadge.textContent = text;
      statusBadge.classList.remove('active', 'error');
      if(mode) statusBadge.classList.add(mode);
    }

    function dist(a, b){
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    // Простой подсчёт разогнутых пальцев по 21 точке руки.
    // Указательный/средний/безымянный/мизинец: палец разогнут,
    // если кончик выше среднего сустава (работает, когда ладонь
    // более-менее обращена к камере и рука не сильно наклонена).
    // Большой палец считается отдельно: сравниваем, насколько
    // кончик большого пальца удалён от основания мизинца —
    // так подсчёт не зависит от того, левая рука или правая.
    function countExtendedFingers(landmarks){
      let count = 0;
      const fingers = [[8, 6], [12, 10], [16, 14], [20, 18]];
      for(const [tip, pip] of fingers){
        if(landmarks[tip].y < landmarks[pip].y) count++;
      }
      const palmBase = landmarks[17];
      const thumbDist = dist(landmarks[4], palmBase);
      const thumbJointDist = dist(landmarks[3], palmBase);
      if(thumbDist > thumbJointDist * 1.1) count++;
      return count;
    }

    // Явный список "костей" руки: [сустав A, сустав B, толщина].
    // Толщина уменьшается от ладони к кончикам пальцев, как у
    // настоящих фаланг — это и создаёт ощущение анатомической модели.
    const HAND_BONES = [
      [0,1,3.0], [1,2,2.6], [2,3,2.1], [3,4,1.6],       // большой палец
      [0,5,3.2], [5,6,2.6], [6,7,2.1], [7,8,1.6],       // указательный
      [5,9,3.0], [9,10,2.6], [10,11,2.1], [11,12,1.6],  // средний
      [9,13,3.0],[13,14,2.6],[14,15,2.1],[15,16,1.6],   // безымянный
      [13,17,3.0],[17,18,2.6],[18,19,2.1],[19,20,1.6],  // мизинец
      [0,17,3.0]                                         // основание ладони
    ];

    function jointRadiusFor(idx){
      if(idx === 0) return 5.5;                              // запястье
      if([1,5,9,13,17].includes(idx)) return 4.2;            // костяшки (MCP)
      if([2,6,10,14,18].includes(idx)) return 3.4;           // средние суставы
      if([3,7,11,15,19].includes(idx)) return 2.8;           // предпоследние суставы
      return 2.4;                                            // кончики пальцев
    }

    function toPx(lm){
      return { x: lm.x * canvasEl.width, y: lm.y * canvasEl.height };
    }

    // Рисуем кость как гранёный "капсульный" сегмент с поперечным
    // градиентом — это даёт иллюзию объёма (цилиндра), а не плоской линии.
    function drawBone(p1, p2, width){
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;
      const nx = -uy, ny = ux;
      const inset = width * 0.9; // не доходим до центра сустава, чтобы был виден шарик
      const ax = p1.x + ux * inset, ay = p1.y + uy * inset;
      const bx = p2.x - ux * inset, by = p2.y - uy * inset;

      const grad = ctx.createLinearGradient(ax + nx * width, ay + ny * width, ax - nx * width, ay - ny * width);
      grad.addColorStop(0,   'rgba(90, 0, 0, 0.9)');
      grad.addColorStop(0.5, 'rgba(255, 45, 45, 0.98)');
      grad.addColorStop(1,   'rgba(90, 0, 0, 0.9)');

      ctx.beginPath();
      ctx.moveTo(ax + nx * width, ay + ny * width);
      ctx.lineTo(bx + nx * width, by + ny * width);
      ctx.lineTo(bx - nx * width, by - ny * width);
      ctx.lineTo(ax - nx * width, ay - ny * width);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();
    }

    // Сустав — шарик с радиальным градиентом и бликом, как гладкая кость.
    function drawJoint(p, radius){
      const grad = ctx.createRadialGradient(
        p.x - radius * 0.35, p.y - radius * 0.35, radius * 0.15,
        p.x, p.y, radius
      );
      grad.addColorStop(0,   '#ffe8e8');
      grad.addColorStop(0.45,'#ff3b3b');
      grad.addColorStop(1,   '#7a0000');

      ctx.beginPath();
      ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    function drawHandSkeleton(landmarks){
      const points = landmarks.map(toPx);

      ctx.save();
      ctx.shadowColor = 'rgba(255, 20, 20, 0.65)';
      ctx.shadowBlur = 10;

      for(const [a, b, width] of HAND_BONES){
        drawBone(points[a], points[b], width);
      }
      for(let i = 0; i < points.length; i++){
        drawJoint(points[i], jointRadiusFor(i));
      }

      ctx.restore();
    }

    function render(){
      ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);

      // --- лицо ---
      for(const landmarks of latestFaceLandmarks){
        drawConnectors(ctx, landmarks, FACEMESH_TESSELATION, {
          color: 'rgba(57, 255, 157, 0.55)', lineWidth: 1
        });
        drawConnectors(ctx, landmarks, FACEMESH_FACE_OVAL,    { color: '#24e0ff', lineWidth: 1.5 });
        drawConnectors(ctx, landmarks, FACEMESH_LEFT_EYE,     { color: '#24e0ff', lineWidth: 1.5 });
        drawConnectors(ctx, landmarks, FACEMESH_RIGHT_EYE,    { color: '#24e0ff', lineWidth: 1.5 });
        drawConnectors(ctx, landmarks, FACEMESH_LEFT_EYEBROW, { color: '#24e0ff', lineWidth: 1.5 });
        drawConnectors(ctx, landmarks, FACEMESH_RIGHT_EYEBROW,{ color: '#24e0ff', lineWidth: 1.5 });
        drawConnectors(ctx, landmarks, FACEMESH_LIPS,         { color: '#24e0ff', lineWidth: 1.5 });
        if(typeof FACEMESH_LEFT_IRIS !== 'undefined'){
          drawConnectors(ctx, landmarks, FACEMESH_LEFT_IRIS,  { color: '#ffffff', lineWidth: 1 });
          drawConnectors(ctx, landmarks, FACEMESH_RIGHT_IRIS, { color: '#ffffff', lineWidth: 1 });
        }
        drawLandmarks(ctx, landmarks, { color: '#39ff9d', fillColor: '#39ff9d', radius: 0.8 });
      }

      // --- руки ---
      let totalFingers = 0;
      const perHand = [];
      for(const landmarks of latestHandLandmarks){
        drawHandSkeleton(landmarks);
        const n = countExtendedFingers(landmarks);
        perHand.push(n);
        totalFingers += n;
      }

      // --- обновление панелей ---
      faceCountEl.textContent = latestFaceLandmarks.length;

      if(latestHandLandmarks.length > 0){
        fingerCountEl.firstChild.textContent = totalFingers;
        fingerBreakdownEl.textContent = perHand.length > 1
          ? `(${perHand.join(' + ')})`
          : '';
        handStatusEl.textContent = `рук обнаружено: ${latestHandLandmarks.length}`;
      } else {
        fingerCountEl.firstChild.textContent = '—';
        fingerBreakdownEl.textContent = '';
        handStatusEl.textContent = 'рук не обнаружено';
      }

      if(latestFaceLandmarks.length > 0 || latestHandLandmarks.length > 0){
        setStatus('объект обнаружен', 'active');
      } else {
        setStatus('поиск…', null);
      }

      const now = performance.now();
      fpsEl.textContent = `fps: ${(1000 / (now - lastFrameTime)).toFixed(0)}`;
      lastFrameTime = now;
    }

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/${file}`
    });
    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });
    faceMesh.onResults((results) => {
      if(canvasEl.width !== results.image.width || canvasEl.height !== results.image.height){
        canvasEl.width = results.image.width;
        canvasEl.height = results.image.height;
      }
      latestFaceLandmarks = results.multiFaceLandmarks || [];
      render();
    });

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`
    });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });
    hands.onResults((results) => {
      latestHandLandmarks = results.multiHandLandmarks || [];
      render();
    });

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      startBtn.textContent = 'Запрашиваем доступ…';
      setStatus('запрос доступа к камере', null);

      try{
        const camera = new Camera(videoEl, {
          onFrame: async () => {
            await faceMesh.send({ image: videoEl });
            await hands.send({ image: videoEl });
          },
          width: 1280,
          height: 960
        });
        await camera.start();

        startOverlay.classList.add('hidden');
        setStatus('камера активна', 'active');
      } catch(err){
        console.error(err);
        setStatus('доступ к камере отклонён', 'error');
        startBtn.disabled = false;
        startBtn.textContent = 'Повторить попытку';

        const p = startOverlay.querySelector('p');
        p.textContent = 'Не удалось получить доступ к камере. Проверьте, что сайт открыт по HTTPS (или localhost) и что разрешение на камеру не заблокировано в настройках браузера. Затем нажмите кнопку ещё раз.';
      }
    });
  </script>

</body>
</html>
